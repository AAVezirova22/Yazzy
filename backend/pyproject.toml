[project]
name = "yazzy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6", "alembic==1.20.1", "celery==5.6.3",
  "redis==8.1.0", "httpx==0.28.1", "pydantic==2.14.1",
  "pyjwt[crypto]==2.15.1", "authlib==1.9.1", "itsdangerous==2.2.0"
]
[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.170.9", "ruff==0.17.2", "mypy==2.4.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
